name: Reusable Playwright

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "22"
      package-manager:
        description: npm, pnpm, yarn, or bun
        required: false
        type: string
        default: npm
      pnpm-version:
        description: pnpm version used when package-manager is pnpm
        required: false
        type: string
        default: "10"
      working-directory:
        required: false
        type: string
        default: "."
      install-command:
        description: Optional explicit dependency install command; empty uses the package manager's frozen install
        required: false
        type: string
        default: ""
      test-command:
        description: Optional explicit Playwright test command
        required: false
        type: string
        default: ""
      install-browsers:
        description: Install Chromium and Linux dependencies
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      PACKAGE_MANAGER: ${{ inputs.package-manager }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Enable Corepack for Yarn
        if: inputs.package-manager == 'yarn'
        run: corepack enable

      - name: Install dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: |
          if [ -n "$INSTALL_COMMAND" ]; then
            bash -lc "$INSTALL_COMMAND"
            exit
          fi

          case "$PACKAGE_MANAGER" in
            npm) npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable ;;
            bun) bun install --frozen-lockfile ;;
            *)
              echo "::error::Unsupported package-manager: $PACKAGE_MANAGER"
              exit 2
              ;;
          esac

      - name: Install Chromium
        if: inputs.install-browsers
        run: |
          case "$PACKAGE_MANAGER" in
            npm) npx playwright install --with-deps chromium ;;
            pnpm) pnpm exec playwright install --with-deps chromium ;;
            yarn) yarn playwright install --with-deps chromium ;;
            bun) bunx playwright install --with-deps chromium ;;
          esac

      - name: Run Playwright
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          if [ -n "$TEST_COMMAND" ]; then
            bash -lc "$TEST_COMMAND"
            exit
          fi

          case "$PACKAGE_MANAGER" in
            npm) npx playwright test ;;
            pnpm) pnpm exec playwright test ;;
            yarn) yarn playwright test ;;
            bun) bunx playwright test ;;
          esac

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ${{ inputs.working-directory }}/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: ${{ inputs.working-directory }}/test-results
          if-no-files-found: ignore
          retention-days: 14
