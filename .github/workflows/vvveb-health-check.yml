name: Vvveb health check

on:
  push:
    paths:
      - '.github/workflows/vvveb-health-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Vvveb public endpoints
        shell: bash
        run: |
          set -u
          urls=(
            "https://vvveb-cdo-2844s-projects.vercel.app/"
            "https://vvveb-cdo-2844s-projects.vercel.app/__health"
            "https://vvveb-cdo-2844s-projects.vercel.app/admin/"
          )
          for url in "${urls[@]}"; do
            echo "=== $url ==="
            headers=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)
            echo "HTTP=$code"
            echo "LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); print substr($0,index($0,$2)); exit}' "$headers")"
            echo "SERVER=$(awk 'BEGIN{IGNORECASE=1} /^server:/{sub(/\r$/,""); print substr($0,index($0,$2)); exit}' "$headers")"
            echo "CONTENT_TYPE=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/\r$/,""); print substr($0,index($0,$2)); exit}' "$headers")"
            echo "BODY_SNIPPET=$(tr '\n' ' ' < "$body" | head -c 500)"
            final=$(curl -sS -L --max-time 30 -o /dev/null -w '%{http_code} %{url_effective}' "$url" || true)
            echo "FINAL=$final"
            rm -f "$headers" "$body"
          done
