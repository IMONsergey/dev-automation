name: Vvveb probe
on:
  push:
    branches:
      - automation/vvveb-probe-20260904
  pull_request:
    branches:
      - main
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Vvveb endpoints
        shell: bash
        run: |
          set -u
          for url in \
            'https://vvveb-cdo-2844s-projects.vercel.app' \
            'https://vvveb-cdo-2844s-projects.vercel.app/__health' \
            'https://vvveb-cdo-2844s-projects.vercel.app/admin/'; do
            echo "=== $url ==="
            curl -sS -o /tmp/body -D /tmp/headers --max-time 30 "$url" || true
            head -n 1 /tmp/headers || true
            grep -iE '^(location|server|x-vercel|content-type):' /tmp/headers || true
            echo 'BODY:'
            head -c 300 /tmp/body | tr '\n' ' ' || true
            echo
          done
