name: Foundation Validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "examples/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate YAML syntax
        shell: python
        run: |
          import pathlib
          import sys
          import yaml

          files = list(pathlib.Path('.github').rglob('*.yml')) + list(pathlib.Path('examples').rglob('*.yml'))
          failures = []
          for path in files:
              try:
                  yaml.safe_load(path.read_text())
                  print(f'OK {path}')
              except Exception as exc:
                  failures.append(f'{path}: {exc}')
          if failures:
              print('\n'.join(failures), file=sys.stderr)
              raise SystemExit(1)

      - name: Check reusable workflow contract
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/workflows/reusable-*.yml; do
            grep -q 'workflow_call:' "$file"
            echo "Reusable contract present: $file"
          done

      - name: Check forbidden trigger
        shell: bash
        run: |
          if grep -R --line-number 'pull_request_target:' .github/workflows; then
            echo '::error::pull_request_target is forbidden in shared automation'
            exit 1
          fi
